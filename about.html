<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="about" data-root="">

  <header class="site-header wrap">
    <a class="brand" href="index.html" data-site="name">Artist Name</a>
    <nav class="nav" aria-label="Main">
      <a href="work.html">Work</a>
      <a href="about.html" aria-current="page">About</a>
      <a href="#contact-info">Contact</a>
    </nav>
  </header>

  <main>
    <section class="about-top wrap" aria-label="About the artist">
      <div class="portrait" id="portrait"></div>
      <div class="text">
        <span class="eyebrow">Artist statement</span>
        <h1 data-site="name">Artist Name</h1>
        <!-- Filled from data/about.json (edit it at /admin) -->
        <div class="statement" id="statement"></div>
      </div>
    </section>

    <section class="cv wrap" aria-label="Background">
      <div>
        <h2>Education</h2>
        <!-- Filled from data/about.json -->
        <ul id="cv-education"></ul>
      </div>
      <div id="exhibitions">
        <h2>Exhibitions</h2>
        <!-- Filled from data/exhibitions.json: shows that have already opened -->
        <ul id="cv-exhibitions"></ul>
      </div>
      <!-- Shown only when "Show awards & press" is on in data/about.json and the list is not empty -->
      <div id="cv-awards-col" hidden>
        <h2>Awards &amp; press</h2>
        <ul id="cv-awards"></ul>
      </div>
    </section>

    <section class="studio wrap" aria-label="Studio">
      <div id="studio"></div>
    </section>

    <section class="contact wrap" id="contact-info" aria-label="Contact">
      <span class="eyebrow">Contact</span><br>
      <a class="big" data-site="email" href="#">hello@example.com</a>
      <div class="links">
        <a data-site="instagram" href="#">Instagram</a>
        <a data-site="behance" href="#">Behance</a>
        <a data-site="saatchi" href="#">Saatchi Art profile</a>
      </div>
    </section>
  </main>

  <footer class="site-footer wrap" id="contact">
    <div class="links">
      <a data-site="email" href="#">hello@example.com</a>
      <a data-site="instagram" href="#">Instagram</a>
      <a data-site="saatchi" href="#">Saatchi Art</a>
    </div>
    <div class="legal">
      <span>© <span data-now-year>2026</span> <span data-site="name">Artist Name</span></span>
      <a href="privacy.html">Privacy</a>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
